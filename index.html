<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Archive</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  background: radial-gradient(circle at center, #001a2e 0%, #000 70%);
  color: white;
  overflow: hidden;
}

/* ================= PASSWORD SCREEN ================= */

#password-screen {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.lock-card {
  padding: 40px;
  border-radius: 20px;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(20px);
  box-shadow: 0 0 50px #00aaff;
  text-align: center;
  width: 85%;
  max-width: 350px;
}

.lock-card h1 {
  color: #00c3ff;
  margin-bottom: 20px;
  letter-spacing: 3px;
}

.lock-card input {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #00aaff;
  background: black;
  color: #00c3ff;
  margin-bottom: 15px;
  outline: none;
}

.lock-card button {
  width: 100%;
  padding: 14px;
  border-radius: 30px;
  border: none;
  background: #00aaff;
  color: black;
  font-weight: bold;
  box-shadow: 0 0 20px #00aaff;
  cursor: pointer;
  transition: 0.3s;
}

.lock-card button:hover {
  box-shadow: 0 0 40px #00c3ff;
}

/* ================= PLAYER ================= */

.player {
  display: none;
  height: 100vh;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

/* Album Container */
.album-container {
  position: relative;
  width: 260px;
  height: 260px;
  margin-bottom: 30px;
}

/* Cover */
.cover {
  width: 100%;
  height: 100%;
  border-radius: 15px;
  overflow: hidden;
  position: absolute;
  z-index: 2;
  box-shadow: 0 0 40px #00aaff;
}

.cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* CD */
.cd {
  position: absolute;
  top: 15px;
  left: 60px;
  width: 230px;
  height: 230px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 40%, #ffffff 0%, #bbbbbb 40%, #999 70%, #666 100%);
  box-shadow: 0 0 30px #00aaff;
  transition: transform 0.6s ease;
  z-index: 1;
}

/* Center hole */
.cd::after {
  content: "";
  position: absolute;
  width: 40px;
  height: 40px;
  background: black;
  border-radius: 50%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

/* Slide out when playing */
.album-container.playing .cd {
  transform: translateX(110px);
}

/* Spin animation */
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.spinning {
  animation: spin 4s linear infinite;
}

/* Track Info */
.track-title {
  font-size: 18px;
  letter-spacing: 2px;
  margin-bottom: 5px;
  color: #00c3ff;
}

.time {
  font-size: 14px;
  color: #aaa;
  margin-bottom: 25px;
}

/* Controls */
.controls {
  display: flex;
  align-items: center;
  gap: 40px;
}

.controls button {
  background: none;
  border: none;
  font-size: 24px;
  color: #00c3ff;
  cursor: pointer;
  transition: 0.3s;
}

.controls button:hover {
  text-shadow: 0 0 15px #00c3ff;
  transform: scale(1.2);
}

</style>
</head>

<body>

<!-- PASSWORD SCREEN -->
<div id="password-screen">
  <div class="lock-card">
    <h1>ACCESS ARCHIVE</h1>
    <input type="password" id="password-input" placeholder="Enter password">
    <button onclick="checkPassword()">ENTER</button>
  </div>
</div>

<!-- PLAYER -->
<div class="player" id="player">

  <div class="album-container" id="album">
    <div class="cd" id="cd"></div>
    <div class="cover">
      <img src="cover.jpg">
    </div>
  </div>

  <div class="track-title" id="track-title">Track 01</div>
  <div class="time" id="time">0:00</div>

  <div class="controls">
    <button onclick="prevTrack()">⟵</button>
    <button onclick="togglePlay()" id="play-btn">▶</button>
    <button onclick="nextTrack()">⟶</button>
  </div>

  <audio id="audio"></audio>

</div>

<script>

const password = "1234"; // CHANGE THIS

const tracks = [
"track1.mp3","track2.mp3","track3.mp3",
"track4.mp3","track5.mp3","track6.mp3",
"track7.mp3","track8.mp3","track9.mp3",
"track10.mp3","track11.mp3","track12.mp3",
"track13.mp3"
];

let currentTrack = 0;
const audio = document.getElementById("audio");
const title = document.getElementById("track-title");
const time = document.getElementById("time");
const album = document.getElementById("album");
const cd = document.getElementById("cd");
const playBtn = document.getElementById("play-btn");

function checkPassword(){
  const input = document.getElementById("password-input").value;
  if(input === password){
    document.getElementById("password-screen").style.display = "none";
    document.getElementById("player").style.display = "flex";
    loadTrack();
  } else {
    alert("Wrong password");
  }
}

function loadTrack(){
  audio.src = tracks[currentTrack];
  title.innerText = "Track " + String(currentTrack+1).padStart(2,'0');
}

function togglePlay(){
  if(audio.paused){
    audio.play();
    playBtn.innerText = "❚❚";
    album.classList.add("playing");
    cd.classList.add("spinning");
  } else {
    audio.pause();
    playBtn.innerText = "▶";
    album.classList.remove("playing");
    cd.classList.remove("spinning");
  }
}

function nextTrack(){
  currentTrack = (currentTrack+1)%tracks.length;
  loadTrack();
  audio.play();
  togglePlay();
}

function prevTrack(){
  currentTrack = (currentTrack-1+tracks.length)%tracks.length;
  loadTrack();
  audio.play();
  togglePlay();
}

audio.addEventListener("timeupdate", () => {
  let minutes = Math.floor(audio.currentTime / 60);
  let seconds = Math.floor(audio.currentTime % 60);
  if(seconds < 10) seconds = "0" + seconds;
  time.innerText = minutes + ":" + seconds;
});

</script>

</body>
</html>
