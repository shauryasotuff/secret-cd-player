<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>★</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  background:#060b14;
  color:white;
  height:100vh;
  overflow:hidden;
}

/* PASSWORD SCREEN */
#password-screen{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at center,#0e1a2b 0%,#04070d 70%);
}

.lock-card{
  padding:40px;
  width:85%;
  max-width:360px;
  border-radius:20px;
  text-align:center;
  backdrop-filter:blur(20px);
  background:rgba(15,20,30,0.8);
  border:1px solid rgba(0,255,255,0.15);
  box-shadow:0 0 50px rgba(0,255,255,0.15);
}

.lock-card h1{
  margin-bottom:20px;
  letter-spacing:2px;
  color:#7fe9ff;
}

.lock-card input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(127,233,255,0.3);
  background:#0c111c;
  color:#7fe9ff;
  margin-bottom:15px;
}

.lock-card button{
  width:100%;
  padding:14px;
  border-radius:30px;
  border:none;
  background:linear-gradient(135deg,#00cfff,#0077ff);
  color:black;
  font-weight:600;
  cursor:pointer;
}

/* PLAYER */
.player{
  display:none;
  height:100vh;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:20px;
}

/* Album */
.album-container{
  position:relative;
  width:260px;
  height:260px;
  margin-bottom:35px;
}

/* CD */
.cd{
  position:absolute;
  top:15px;
  left:15px;
  width:230px;
  height:230px;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 35%, #ffffff 0%, #dcdcdc 30%, #aaa 60%, #777 100%);
  box-shadow:
    0 0 30px rgba(0,255,255,0.2),
    inset 0 0 30px rgba(255,255,255,0.5);
  z-index:1;
  transform:translateX(-30px); /* slight visible edge */
  transition:transform 0.6s ease;
}

/* center hole */
.cd {
  position: absolute;
  top: 15px;
  left: 15px;
  width: 230px;
  height: 230px;
  border-radius: 50%;
  transform: translateX(-30px); /* slight visible edge */
  transition: transform 0.6s ease;
}

/* Cover */
.cover{
  position:absolute;
  width:100%;
  height:100%;
  border-radius:18px;
  overflow:hidden;
  z-index:2;
  box-shadow:0 0 40px rgba(0,255,255,0.2);
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* Slide out */
.album-container.playing .cd{
  transform:translateX(110px);
}

/* Spin */
@keyframes spin {
  from { rotate: 0deg; }
  to { rotate: 360deg; }
}

.spinning {
  animation: spin 4s linear infinite;
}

/* Track */
.track-title{
  font-size:20px;
  letter-spacing:2px;
  margin-bottom:8px;
  color:#7fe9ff;
}

.time{
  font-size:14px;
  opacity:0.7;
  margin-bottom:30px;
}

/* Controls */
.controls{
  display:flex;
  gap:40px;
}

.controls button{
  background:rgba(20,30,45,0.6);
  border:1px solid rgba(127,233,255,0.2);
  width:55px;
  height:55px;
  border-radius:50%;
  color:#7fe9ff;
  font-size:20px;
  cursor:pointer;
}

</style>
</head>

<body>

<div id="password-screen">
  <div class="lock-card">
    <h1>here's a little surprise for u, my love♥︎</h1>
    <input type="password" id="password-input" placeholder="Enter key">
    <button onclick="checkPassword()">okie hai jaanu</button>
  </div>
</div>

<div class="player" id="player">

  <div class="album-container" id="album">
    <div class="cd" id="cd"></div>
    <div class="cover">
      <img src="cover.jpg">
    </div>
  </div>

  <div class="track-title" id="track-title">Track 01</div>
  <div class="time" id="time">0:00</div>

  <div class="controls">
    <button onclick="prevTrack()">⟵</button>
    <button onclick="togglePlay()" id="play-btn">▶</button>
    <button onclick="nextTrack()">⟶</button>
  </div>

  <audio id="audio"></audio>
</div>

<script>

const password="mehufriedmomos";

const tracks=[
"track1.mp3","track2.mp3","track3.mp3",
"track4.mp3","track5.mp3","track6.mp3",
"track7.mp3","track8.mp3","track9.mp3",
"track10.mp3","track11.mp3","track12.mp3",
"track13.mp3"
];

let currentTrack=0;
const audio=document.getElementById("audio");
const album=document.getElementById("album");
const cd=document.getElementById("cd");
const playBtn=document.getElementById("play-btn");
const title=document.getElementById("track-title");
const time=document.getElementById("time");

function checkPassword(){
  if(document.getElementById("password-input").value===password){
    document.getElementById("password-screen").style.display="none";
    document.getElementById("player").style.display="flex";
    loadTrack();
  }else{
    alert("Wrong key");
  }
}

function loadTrack(){
  audio.src=tracks[currentTrack];
  title.innerText="Track "+String(currentTrack+1).padStart(2,'0');
}

function togglePlay(){
  if(audio.paused){
    audio.play();
    playBtn.innerText="❚❚";
    album.classList.add("playing");
    cd.classList.add("spinning");
  }else{
    audio.pause();
    playBtn.innerText="▶";
    album.classList.remove("playing");
    cd.classList.remove("spinning");
  }
}

function nextTrack(){
  currentTrack=(currentTrack+1)%tracks.length;
  loadTrack();
  audio.play();
  album.classList.add("playing");
  cd.classList.add("spinning");
  playBtn.innerText="❚❚";
}

function prevTrack(){
  currentTrack=(currentTrack-1+tracks.length)%tracks.length;
  loadTrack();
  audio.play();
  album.classList.add("playing");
  cd.classList.add("spinning");
  playBtn.innerText="❚❚";
}

audio.addEventListener("timeupdate",()=>{
  let m=Math.floor(audio.currentTime/60);
  let s=Math.floor(audio.currentTime%60);
  if(s<10)s="0"+s;
  time.innerText=m+":"+s;
});

</script>

</body>
</html>
