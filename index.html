<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>★</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  background:#060b14;
  color:white;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* ================= PASSWORD SCREEN ================= */

#password-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at center,#0e1a2b 0%,#04070d 70%);
}

.lock-card{
  padding:40px;
  width:85%;
  max-width:360px;
  border-radius:20px;
  text-align:center;
  backdrop-filter:blur(20px);
  background:rgba(15,20,30,0.85);
  border:1px solid rgba(0,255,255,0.15);
  box-shadow:0 0 40px rgba(0,255,255,0.15);
}

.lock-card h1{
  margin-bottom:20px;
  letter-spacing:2px;
  font-weight:600;
  color:#8cefff;
}

.lock-card input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(140,239,255,0.3);
  background:#0c111c;
  color:#8cefff;
  margin-bottom:15px;
}

.lock-card button{
  width:100%;
  padding:14px;
  border-radius:30px;
  border:none;
  background:linear-gradient(135deg,#00cfff,#0077ff);
  color:black;
  font-weight:600;
  cursor:pointer;
}

/* ================= PLAYER ================= */

.player{
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100%;
  padding:20px;
}

/* Album */
.album-container{
  position:relative;
  width:260px;
  height:260px;
  margin-bottom:35px;
}

/* CD wrapper handles slide */
.cd-wrapper{
  position:absolute;
  top:15px;
  left:15px;
  width:230px;
  height:230px;
  transform:translateX(0px);
  transition:transform 0.6s ease;
  z-index:1;
}

/* Slide out */
.album-container.playing .cd-wrapper{
  transform:translateX(110px);
}

/* CD handles rotation */
.cd{
  width:100%;
  height:100%;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 35%, #ffffff 0%, #dcdcdc 30%, #aaa 60%, #777 100%),
    repeating-radial-gradient(circle,
      rgba(255,255,255,0.15) 0px,
      rgba(255,255,255,0.15) 1px,
      transparent 2px,
      transparent 4px
    );
  box-shadow:
    0 0 30px rgba(0,255,255,0.25),
    inset 0 0 30px rgba(255,255,255,0.5);
}

/* Center hole */
.cd::after{
  content:"";
  position:absolute;
  width:40px;
  height:40px;
  background:#060b14;
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

/* Spin animation */
@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

.spinning{
  animation:spin 4s linear infinite;
}

/* Cover */
.cover{
  position:absolute;
  width:100%;
  height:100%;
  border-radius:18px;
  overflow:hidden;
  z-index:2;
  box-shadow:0 0 40px rgba(0,255,255,0.2);
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* Track info */
.track-title{
  font-size:20px;
  letter-spacing:2px;
  margin-bottom:8px;
  color:#8cefff;
}

.time{
  font-size:14px;
  opacity:0.7;
  margin-bottom:30px;
}

/* Controls */
.controls{
  display:flex;
  gap:40px;
}

.controls button{
  background:rgba(20,30,45,0.6);
  border:1px solid rgba(140,239,255,0.2);
  width:60px;
  height:60px;
  border-radius:50%;
  color:#8cefff;
  font-size:20px;
  cursor:pointer;
  transition:0.3s;
}

.controls button:hover{
  background:linear-gradient(135deg,#00cfff,#0077ff);
  color:black;
  transform:scale(1.1);
}

</style>
</head>

<body>

<div id="password-screen">
  <div class="lock-card">
    <h1>here's a little surprise for u, my love♥︎</h1>
    <input type="password" id="password-input" placeholder="enter kuch toh">
    <button onclick="checkPassword()">okie hai jaanu</button>
  </div>
</div>

<div class="player" id="player">

  <div class="album-container" id="album">
    <div class="cd-wrapper">
      <div class="cd" id="cd"></div>
    </div>
    <div class="cover">
      <img src="cover.jpg">
    </div>
  </div>

  <div class="track-title" id="track-title">Track 01</div>
  <div class="time" id="time">0:00</div>

  <div class="controls">
    <button onclick="prevTrack()">⟵</button>
    <button onclick="togglePlay()" id="play-btn">▶</button>
    <button onclick="nextTrack()">⟶</button>
  </div>

  <audio id="audio"></audio>
</div>

<script>

const password="mehufriedmomos";

const tracks=[
"track1.flac","track2.flac","track3.flac",
"track4.flac","track5.flac","track6.flac",
"track7.mp3","track8.flac","track9.flac",
"track10.flac","track11.flac","track12.flac",
"track13.flac"
];

let currentTrack=0;
const audio=document.getElementById("audio");
const album=document.getElementById("album");
const cd=document.getElementById("cd");
const playBtn=document.getElementById("play-btn");
const title=document.getElementById("track-title");
const time=document.getElementById("time");

function checkPassword(){
  if(document.getElementById("password-input").value===password){
    document.getElementById("password-screen").style.display="none";
    document.getElementById("player").style.display="flex";
    loadTrack();
  }else{
    alert("Wrong key");
  }
}

function loadTrack(){
  audio.src=tracks[currentTrack];
  title.innerText="Track "+String(currentTrack+1).padStart(2,'0');
}

function togglePlay(){
  if(audio.paused){
    audio.play();
    playBtn.innerText="❚❚";
    album.classList.add("playing");

    setTimeout(()=>{
      cd.classList.add("spinning");
    },300);

  }else{
    audio.pause();
    playBtn.innerText="▶";
    cd.classList.remove("spinning");
    album.classList.remove("playing");
  }
}

function nextTrack(){
  currentTrack=(currentTrack+1)%tracks.length;
  loadTrack();
  audio.play();
  album.classList.add("playing");
  cd.classList.add("spinning");
  playBtn.innerText="❚❚";
}

function prevTrack(){
  currentTrack=(currentTrack-1+tracks.length)%tracks.length;
  loadTrack();
  audio.play();
  album.classList.add("playing");
  cd.classList.add("spinning");
  playBtn.innerText="❚❚";
}

audio.addEventListener("timeupdate",()=>{
  let m=Math.floor(audio.currentTime/60);
  let s=Math.floor(audio.currentTime%60);
  if(s<10)s="0"+s;
  time.innerText=m+":"+s;
});

</script>

</body>
</html>
