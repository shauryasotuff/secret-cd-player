<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>★</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  background:#060b14;
  color:white;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* ================= PASSWORD SCREEN ================= */

#password-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at center,#0e1a2b 0%,#04070d 70%);
}

.lock-card{
  padding:40px;
  width:85%;
  max-width:360px;
  border-radius:20px;
  text-align:center;
  backdrop-filter:blur(20px);
  background:rgba(15,20,30,0.85);
  border:1px solid rgba(0,255,255,0.15);
  box-shadow:0 0 40px rgba(0,255,255,0.15);
}

.lock-card h1{
  margin-bottom:20px;
  letter-spacing:2px;
  font-weight:600;
  color:#8cefff;
}

.lock-card input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(140,239,255,0.3);
  background:#0c111c;
  color:#8cefff;
  margin-bottom:15px;
}

.lock-card button{
  width:100%;
  padding:14px;
  border-radius:30px;
  border:none;
  background:linear-gradient(135deg,#00cfff,#0077ff);
  color:black;
  font-weight:600;
  cursor:pointer;
}

/* ================= PLAYER ================= */

.player{
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100%;
  padding:20px;
}

/* Album */
.album-container{
  position:relative;
  width:260px;
  height:260px;
  margin-bottom:35px;
  isolation:isolate;
  box-shadow:0 0 60px rgba(0,255,255,0.25);
  border-radius:18px;
}

/* CD wrapper handles slide */
.cd-wrapper{
  z-index:3;
  position:absolute;
  top:15px;
  left:15px;
  width:230px;
  height:230px;
  transform:translateX(0px);
  transition:transform 0.6s ease;
  z-index:1;
}

/* Slide out */
.album-container.playing .cd-wrapper{
  transform:translateX(110px);
  z-index:0;
}

/* CD handles rotation */
.cd{
  width:100%;
  height:100%;
  border-radius:50%;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at center,
      transparent 0px,
      transparent 28px,
      #ffffff 29px,
      #dcdcdc 60px,
      #aaa 120px,
      #777 100%
    ),
    repeating-radial-gradient(circle,
      rgba(255,255,255,0.15) 0px,
      rgba(255,255,255,0.15) 1px,
      transparent 2px,
      transparent 4px
    );
  box-shadow:
  0 0 20px rgba(0,255,255,0.25),
  inset 0 0 30px rgba(255,255,255,0.5);
}

.cd::before{
  content:"";
  position:absolute;
  width:200%;
  height:200%;
  top:-50%;
  left:-50%;
  background:linear-gradient(
    120deg,
    transparent 40%,
    rgba(255,255,255,0.25) 50%,
    transparent 60%
  );
  pointer-events:none;
}

/* Spin animation */
@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

.spinning{
  animation:spin 4s linear infinite;
}

.spinning::before{
  animation:spin 6s linear infinite reverse;
}

/* Cover */
.cover{
  z-index:2;
  position:absolute;
  width:100%;
  height:100%;
  border-radius:18px;
  overflow:hidden;
  z-index:3;
  background:#000;
  transform:translateZ(0); /* forces clean rendering */
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* ===== Loading Spinner ===== */
.loader{
  position:absolute;
  width:60px;
  height:60px;
  border:4px solid rgba(140,239,255,0.2);
  border-top:4px solid #00cfff;
  border-radius:50%;
  animation:spinLoader 1s linear infinite;
  display:none;
  z-index:5;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

@keyframes spinLoader{
  from{transform:translate(-50%,-50%) rotate(0deg);}
  to{transform:translate(-50%,-50%) rotate(360deg);}
}

/* ===== Now Playing Glow ===== */
.now-playing{
  animation:glowPulse 2s ease-in-out infinite alternate;
}

@keyframes glowPulse{
  from{box-shadow:0 0 25px rgba(0,255,255,0.3);}
  to{box-shadow:0 0 60px rgba(0,255,255,0.8);}
}

/* Track info */
.track-title{
  font-size:20px;
  letter-spacing:2px;
  margin-bottom:8px;
  color:#8cefff;
}

.time{
  font-size:14px;
  opacity:0.7;
  margin-bottom:30px;
}

/* Controls */
.controls{
  display:flex;
  gap:40px;
}

.controls button{
  background:rgba(20,30,45,0.6);
  border:1px solid rgba(140,239,255,0.2);
  width:60px;
  height:60px;
  border-radius:50%;
  color:#8cefff;
  font-size:20px;
  cursor:pointer;
  transition:0.3s;
}

.controls button:hover{
  background:linear-gradient(135deg,#00cfff,#0077ff);
  color:black;
  transform:scale(1.1);
}

#progress{
  width:100%;
  max-width:260px;
  margin-bottom:25px;
  appearance:none;
  height:4px;
  background:rgba(140,239,255,0.2);
  border-radius:5px;
  outline:none;
}

#progress::-webkit-slider-thumb{
  appearance:none;
  width:14px;
  height:14px;
  border-radius:50%;
  background:#00cfff;
  cursor:pointer;
}

#visualizer{
  position:absolute;
  width:100%;
  height:100%;
  top:0;
  left:0;
  z-index:1;
  opacity:0.3;
}

</style>
</head>

<body>

<div id="password-screen">
  <div class="lock-card">
    <h1>here's a little surprise for u, my love♥︎</h1>
    <input type="password" id="password-input" placeholder="enter kuch toh">
    <button onclick="checkPassword()">okie hai jaanu</button>
  </div>
</div>

<div class="player" id="player">

  <div class="album-container" id="album">
    <div class="cd-wrapper">
      <div class="cd" id="cd"></div>
    </div>
    <div class="cover">
      <img src="cover.jpg">
    </div>
    <div class="loader" id="loader"></div>
    <canvas id="visualizer"></canvas>
  </div>

  <div class="track-title" id="track-title">Track 01</div>
  <div class="time" id="time">0:00</div>
  <input type="range" id="progress" value="0" min="0" max="100">

  <div class="controls">
  <button onclick="prevTrack()">⏮</button>
  <button onclick="togglePlay()" id="play-btn">▶</button>
  <button onclick="nextTrack()">⏭</button>
  <button onclick="toggleLoop()" id="loop-btn">∞</button>
</div>

  <audio id="audio"></audio>
</div>

<script>

const password="mehufriedmomos";

const tracks=[
"track1.mp3","track2.flac","track3.mp3",
"track4.mp3","track5.mp3","track6.mp3",
"track7.mp3","track8.flac","track9.mp3",
"track10.mp3","track11.mp3","track12.flac",
"track13.flac"
];

let currentTrack=0;
const audio=document.getElementById("audio");
const album=document.getElementById("album");
const cd=document.getElementById("cd");
const playBtn=document.getElementById("play-btn");
const title=document.getElementById("track-title");
const time=document.getElementById("time");
const loader=document.getElementById("loader");
let repeatMode = 0; 
// 0 = off
// 1 = repeat one
// 2 = repeat all
const loopBtn = document.getElementById("loop-btn");
const progress = document.getElementById("progress");
let audioCtx;
let analyser;
let source;
let dataArray;
let isInitialized = false;

audio.addEventListener("ended", () => {
  if (repeatMode === 1) {
    audio.play();
  } else if (repeatMode === 2) {
    nextTrack();
  } else {
    if (currentTrack < tracks.length - 1) {
      nextTrack();
    } else {
      playBtn.innerText = "▶";
      album.classList.remove("playing", "now-playing");
      cd.classList.remove("spinning");
    }
  }
});

function checkPassword(){
  if(document.getElementById("password-input").value === password){
    document.getElementById("password-screen").style.display = "none";
    document.getElementById("player").style.display = "flex";
    
    // Call the visualizer setup now that the player is visible
    initVisualizer(); 

    loadTrack();
    let savedTrack = localStorage.getItem("trackIndex");
    let savedTime = localStorage.getItem("trackTime");

    if(savedTrack !== null){
      currentTrack = parseInt(savedTrack);
      loadTrack();
      audio.currentTime = parseFloat(savedTime) || 0;
    }
  } else {
    alert("Wrong key");
  }
}

function loadTrack(){
  loader.style.display="block";
  audio.src=tracks[currentTrack];
  const img = document.querySelector(".cover img");

img.onload = function(){
  const tempCanvas = document.createElement("canvas");
  const tempCtx = tempCanvas.getContext("2d");

  tempCanvas.width = img.width;
  tempCanvas.height = img.height;

  tempCtx.drawImage(img,0,0);

  const pixel = tempCtx.getImageData(10,10,1,1).data;
  const color = `rgb(${pixel[0]},${pixel[1]},${pixel[2]})`;

  album.style.boxShadow = `0 0 60px ${color}`;
};
  title.innerText="Track "+String(currentTrack+1).padStart(2,'0');

  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: title.innerText,
      artist: "★shaurya★",
      album: "★",
      artwork: [
        { src: "cover.jpg", sizes: "512x512", type: "image/jpeg" }
      ]
    });
  }
}

function togglePlay(){
  audioCtx.resume();
  
  if(audio.paused){
    audio.play();
    playBtn.innerText="❚❚";
    album.classList.add("playing");
    album.classList.add("now-playing");

    setTimeout(()=>{
      cd.classList.add("spinning");
    },300);

  }else{
    audio.pause();
    playBtn.innerText="▶";
    cd.classList.remove("spinning");
    album.classList.remove("now-playing");

    setTimeout(()=>{
      album.classList.remove("playing");
    },300); // smooth slide back in
  }
}

function nextTrack(){
  currentTrack=(currentTrack+1)%tracks.length;
  loadTrack();
  audio.play();
  album.classList.add("playing");
  album.classList.add("now-playing");
  cd.classList.add("spinning");
  playBtn.innerText="❚❚";
}

function prevTrack(){
  currentTrack=(currentTrack-1+tracks.length)%tracks.length;
  loadTrack();
  audio.play();
  album.classList.add("playing");
  album.classList.add("now-playing");
  cd.classList.add("spinning");
  playBtn.innerText="❚❚";
}

audio.addEventListener("timeupdate",()=>{
  let m=Math.floor(audio.currentTime/60);
  let s=Math.floor(audio.currentTime%60);
  if(s<10)s="0"+s;
  time.innerText=m+":"+s;

  localStorage.setItem("trackIndex", currentTrack);
  localStorage.setItem("trackTime", audio.currentTime);
});

audio.addEventListener("ended",()=>{
  if(repeatMode === 2){
    nextTrack();
  }
});

audio.addEventListener("canplay",()=>{
  loader.style.display="none";
});

function toggleLoop(){
  repeatMode = (repeatMode + 1) % 3;

  if(repeatMode === 0){
    audio.loop = false;
    loopBtn.innerText = "∞";   // normal
    loopBtn.style.background="rgba(20,30,45,0.6)";
    loopBtn.style.color="#8cefff";
  }

  if(repeatMode === 1){
    audio.loop = true;
    loopBtn.innerText = "1";   // repeat one
    loopBtn.style.background="linear-gradient(135deg,#00cfff,#0077ff)";
    loopBtn.style.color="black";
  }

  if(repeatMode === 2){
    audio.loop = false;
    loopBtn.innerText = "ALL"; // repeat all
  }
}

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
  navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
}

const canvas = document.getElementById("visualizer");
const ctx = canvas.getContext("2d");
let audioCtx, analyser, source, dataArray, bufferLength;
let isVisualizerSetup = false;

function initVisualizer() {
  if (isVisualizerSetup) return;
  
  canvas.width = album.offsetWidth;
  canvas.height = album.offsetHeight;

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  source = audioCtx.createMediaElementSource(audio);

  source.connect(analyser);
  analyser.connect(audioCtx.destination);

  analyser.fftSize = 64;
  bufferLength = analyser.frequencyBinCount;
  dataArray = new Uint8Array(bufferLength);

  isVisualizerSetup = true;
  drawVisualizer();
}

function drawVisualizer() {
  if (!isVisualizerSetup) return;
  requestAnimationFrame(drawVisualizer);

  analyser.getByteFrequencyData(dataArray);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let barWidth = (canvas.width / bufferLength) * 2;
  let x = 0;

  for (let i = 0; i < bufferLength; i++) {
    let barHeight = dataArray[i] / 2;
    ctx.fillStyle = "#00cfff";
    ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
    x += barWidth + 2;
  }
}

</script>

</body>
</html>
