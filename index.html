<!DOCTYPE html>
<html>
<head>
  <title>untitled</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: #050510;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      text-align: center;
      width: 90%;
      max-width: 400px;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .container.show {
      opacity: 1;
    }

    .cover-wrapper {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 0 auto 40px auto;
    }

    .cover {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      position: absolute;
      z-index: 2;
      box-shadow: 0 0 40px rgba(0, 140, 255, 0.4);
    }

    .disc {
      position: absolute;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #111 30%, #000 60%);
      top: 10px;
      left: 10px;
      z-index: 1;
      transform: translateX(0);
      transition: transform 1.2s ease;
      box-shadow: 0 0 20px rgba(0, 140, 255, 0.2);
    }

    .disc.slide {
      transform: translateX(140px);
    }

    .disc.spin {
      animation: rotate 6s linear infinite;
      box-shadow: 0 0 60px rgba(0, 140, 255, 0.8);
    }

    @keyframes rotate {
      100% { transform: translateX(140px) rotate(360deg); }
    }

    .center-hole {
      position: absolute;
      width: 30px;
      height: 30px;
      background: #050510;
      border-radius: 50%;
      top: 50%;
      left: calc(50% + 70px);
      transform: translate(-50%, -50%);
      z-index: 3;
    }

    .track-info {
      font-size: 14px;
      letter-spacing: 2px;
      margin-bottom: 8px;
      opacity: 0.8;
    }

    .timer {
      font-size: 13px;
      opacity: 0.4;
      margin-bottom: 25px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 40px;
      font-size: 20px;
      cursor: pointer;
      user-select: none;
    }

    .controls span:hover {
      color: #00aaff;
    }

    input {
      background: transparent;
      border: none;
      border-bottom: 1px solid #333;
      color: white;
      padding: 10px;
      text-align: center;
      outline: none;
      width: 200px;
      margin-bottom: 20px;
    }

    button {
      background: none;
      border: none;
      color: white;
      opacity: 0.6;
      cursor: pointer;
    }

    #player {
      display: none;
    }
  </style>
</head>
<body>

<div id="login">
  <input type="password" id="password" placeholder="enter password">
  <br>
  <button onclick="unlock()">enter</button>
</div>

<div class="container" id="player">

  <div class="cover-wrapper">
    <div class="disc" id="disc"></div>
    <div class="cover" id="cover"></div>
    <div class="center-hole"></div>
  </div>

  <div class="track-info" id="trackInfo">Track 01</div>
  <div class="timer" id="timeDisplay">0:00</div>

  <div class="controls">
    <span onclick="previous()">⟵</span>
    <span onclick="play()">●</span>
    <span onclick="pause()">Ⅱ</span>
    <span onclick="next()">⟶</span>
  </div>

  <audio id="audio"></audio>

</div>

<script>
  const correctPassword = "hersecret";

  const playlist = [
    "track1.mp3","track2.mp3","track3.mp3",
    "track4.mp3","track5.mp3","track6.mp3",
    "track7.mp3","track8.mp3","track9.mp3",
    "track10.mp3","track11.mp3","track12.mp3",
    "track13.mp3"
  ];

  let currentTrack = 0;

  const audio = document.getElementById("audio");
  const disc = document.getElementById("disc");
  const trackInfo = document.getElementById("trackInfo");
  const timeDisplay = document.getElementById("timeDisplay");
  const player = document.getElementById("player");
  const cover = document.getElementById("cover");

  cover.style.backgroundImage = "url('cover.jpg')";

  function unlock() {
    const entered = document.getElementById("password").value;
    if (entered === correctPassword) {
      document.getElementById("login").style.display = "none";
      player.style.display = "block";
      setTimeout(() => player.classList.add("show"), 50);
      loadTrack(currentTrack);
    } else {
      alert("wrong password");
    }
  }

  function loadTrack(index) {
    audio.src = playlist[index];
    trackInfo.textContent = "Track " + String(index + 1).padStart(2, "0");
  }

  function play() {
    audio.play();
    disc.classList.add("slide");
    disc.classList.add("spin");
  }

  function pause() {
    audio.pause();
    disc.classList.remove("spin");
  }

  function next() {
    currentTrack = (currentTrack + 1) % playlist.length;
    loadTrack(currentTrack);
    play();
  }

  function previous() {
    currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
    loadTrack(currentTrack);
    play();
  }

  audio.addEventListener("timeupdate", () => {
    let minutes = Math.floor(audio.currentTime / 60);
    let seconds = Math.floor(audio.currentTime % 60);
    seconds = seconds < 10 ? "0" + seconds : seconds;
    timeDisplay.textContent = minutes + ":" + seconds;
  });

  audio.addEventListener("ended", next);
</script>

</body>
</html>
