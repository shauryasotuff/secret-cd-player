<!DOCTYPE html>
<html>
<head>
  <title>Untitled</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      width: 90%;
      max-width: 400px;
    }

    .disc-wrapper {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 0 auto 30px auto;
    }

    .disc {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #111;
      background-size: cover;
      background-position: center;
      box-shadow: 0 0 40px rgba(255,255,255,0.05);
    }

    .spin {
      animation: rotate 5s linear infinite;
    }

    @keyframes rotate {
      100% { transform: rotate(360deg); }
    }

    .center-hole {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 30px;
      height: 30px;
      background: #0f0f0f;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .track-info {
      font-size: 14px;
      opacity: 0.6;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .timer {
      font-size: 13px;
      opacity: 0.4;
      margin-bottom: 20px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 40px;
      font-size: 20px;
      cursor: pointer;
      user-select: none;
    }

    .controls span:hover {
      opacity: 0.6;
    }

    input {
      background: transparent;
      border: none;
      border-bottom: 1px solid #333;
      color: white;
      padding: 10px;
      text-align: center;
      outline: none;
      width: 200px;
      margin-bottom: 20px;
    }

    button {
      background: none;
      border: none;
      color: white;
      opacity: 0.6;
      cursor: pointer;
    }

    #player {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">

  <div id="login">
    <input type="password" id="password" placeholder="enter password">
    <br>
    <button onclick="unlock()">enter</button>
  </div>

  <div id="player">

    <div class="disc-wrapper">
      <div class="disc" id="disc"></div>
      <div class="center-hole"></div>
    </div>

    <div class="track-info" id="trackInfo">track 01</div>
    <div class="timer" id="timeDisplay">0:00</div>

    <div class="controls">
      <span onclick="previous()">⟵</span>
      <span onclick="play()">●</span>
      <span onclick="pause()">Ⅱ</span>
      <span onclick="next()">⟶</span>
    </div>

    <audio id="audio"></audio>
  </div>

</div>

<script>
  const correctPassword = "hersecret";

  const playlist = [
    "track1.mp3",
    "track2.mp3",
    "track3.mp3"
  ];

  let currentTrack = 0;

  const audio = document.getElementById("audio");
  const disc = document.getElementById("disc");
  const trackInfo = document.getElementById("trackInfo");
  const timeDisplay = document.getElementById("timeDisplay");

  // 🔥 CHANGE THIS TO YOUR COVER IMAGE FILE NAME
  disc.style.backgroundImage = "url('cover.jpg')";

  function unlock() {
    const entered = document.getElementById("password").value;
    if (entered === correctPassword) {
      document.getElementById("login").style.display = "none";
      document.getElementById("player").style.display = "block";
      loadTrack(currentTrack);
    } else {
      alert("wrong password");
    }
  }

  function loadTrack(index) {
    audio.src = playlist[index];
    trackInfo.textContent = "track " + String(index + 1).padStart(2, "0");
  }

  function play() {
    audio.play();
    disc.classList.add("spin");
  }

  function pause() {
    audio.pause();
    disc.classList.remove("spin");
  }

  function next() {
    currentTrack = (currentTrack + 1) % playlist.length;
    loadTrack(currentTrack);
    play();
  }

  function previous() {
    currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
    loadTrack(currentTrack);
    play();
  }

  audio.addEventListener("timeupdate", () => {
    let minutes = Math.floor(audio.currentTime / 60);
    let seconds = Math.floor(audio.currentTime % 60);
    seconds = seconds < 10 ? "0" + seconds : seconds;
    timeDisplay.textContent = minutes + ":" + seconds;
  });

  audio.addEventListener("ended", next);
</script>

</body>
</html>
